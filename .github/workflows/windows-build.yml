name: Windows desktop build

on:
  workflow_dispatch:
  push:
    branches: [voicebridge-mvp]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out VoiceBridge
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Tauri prerequisites
        shell: pwsh
        run: |
          rustup show
          bun --version
          node --version

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Build VoiceBridge installer
        run: bun run tauri build --config src-tauri/tauri.windows.conf.json

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: VoiceBridge-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
